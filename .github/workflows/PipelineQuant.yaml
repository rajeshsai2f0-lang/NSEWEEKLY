name: Daily NSE Quant Automation Pipeline (No-LLM)
on:
  workflow_dispatch:
jobs:
  run-pipeline-quant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl pandas yfinance
      - name: Run NSE Quant (No-LLM) Pipeline
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python main_quant.py
      - name: Upload results CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-quant-results-${{ github.run_number }}
          path: nse_setups_quant_results_*.csv
          retention-days: 30
          if-no-files-found: warn
