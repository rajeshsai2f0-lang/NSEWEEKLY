name: Daily NSE Swing Automation Pipeline
on:
  workflow_dispatch:
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl pandas yfinance mplfinance google-genai pillow
      - name: Run Master NSE Pipeline
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
        run: python main.py
      - name: Upload results CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-swing-results-${{ github.run_number }}
          path: nse_setups_analyzed_results_*.csv
          retention-days: 30
          if-no-files-found: warn
      - name: Upload chart images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swing-charts-${{ github.run_number }}
          path: Tomorrow_Setups_NSE/
